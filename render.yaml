services:
  - type: web
    name: team-mercenarios-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn team_mercenarios.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,.mercenarios.cl
      - key: CORS_ALLOWED_ORIGINS
        value: https://mercenarios.cl,https://www.mercenarios.cl,https://127.0.0.1:5173,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mercenarios.cl,https://www.mercenarios.cl
      - key: DATABASE_URL
        fromDatabase:
          name: team-mercenarios-db
          property: connectionString
      - key: FLOW_API_URL
        value: https://sandbox.flow.cl/api
      - key: FLOW_API_KEY
        sync: false
      - key: FLOW_SECRET_KEY
        sync: false
      - key: FLOW_RETURN_URL
        sync: false
      - key: FLOW_CONFIRM_URL
        sync: false
      - key: FLOW_PORTAL_URL
        value: https://mercenarios.cl/portal

databases:
  - name: team-mercenarios-db
    databaseName: team_mercenarios
    user: mercenarios
    plan: free
